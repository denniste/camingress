# 视频汇聚 - 生产部署 (Linux)
# 启动: docker compose up -d
# 组件: redis + livekit-server + livekit-ingress + mediamtx + camingress(Go中间层)
# 媒体链路: 摄像头 RTSP → mediamtx → WHIP → ingress → LiveKit 房间 → 浏览器

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"       # 信令 (HTTP/WS)
      - "7881:7881"       # WebRTC TCP
      - "7882-7886:7882-7886/udp"  # WebRTC UDP
    depends_on:
      - redis

  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    command: --config /etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml
    ports:
      - "1935:1935"       # RTMP ingress
      - "8081:8080"       # HTTP (WHIP ingress)
    depends_on:
      - redis
      - livekit

  # mediamtx: RTSP 拉流 → WHIP 发布到 ingress (核心媒体引擎, 替代 ffmpeg/go2rtc)
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yaml:/mediamtx.yml
    ports:
      - "9997:9997"       # HTTP API (供 Go 中间层动态管理 path)
      - "8554:8554"       # RTSP 服务 (可选, 重曝/测试源)
      - "8889:8889"       # WebRTC/WHEP 直看 (可选)
      - "8889:8889/udp"
      - "8189:8189/udp"   # WebRTC ICE UDP
    # 注: 官方镜像无 shell/wget, 无法用容器内健康检查; 依赖 camingress 启动时 WaitReady 轮询 API

  camingress:
    build: ../server
    restart: unless-stopped
    environment:
      # 浏览器可达的 LiveKit 地址 (生产设为公网 wss://域名 或 ws://IP:7880)
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      # camingress 容器内部访问 livekit-server 的 twirp API
      LIVEKIT_HTTP_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      CAMINGRESS_SECRET: ${CAMINGRESS_SECRET:-}
      CAMINGRESS_API_KEY: ${CAMINGRESS_API_KEY:-}
      # mediamtx HTTP API 地址 (容器内主机名)
      CAMINGRESS_MTX_URL: http://mediamtx:9997
      # WHIP 发布目标: ingress 容器内 WHIP 端点 (stream key 由 LiveKit 生成)
      CAMINGRESS_WHIP_BASE_URL: http://ingress:8080/whip
      # 容器内 ffmpeg 访问 ingress 的 RTMP 端口 (ffmpeg 回退档)
      CAMINGRESS_RTMP_BASE_URL: rtmp://ingress:1935
    command: -db /data/camingress.db
    volumes:
      - camingress-data:/data
    ports:
      - "8080:8080"       # WebAPI
    depends_on:
      livekit:
        condition: service_started
      ingress:
        condition: service_started
      mediamtx:
        condition: service_healthy

volumes:
  redis-data:
  camingress-data:
