# LiveKit Server 配置 (Linux/Docker)
# 注意: 生产环境务必替换 devkey/secret, 并设置 CAMINGRESS_SECRET
port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7886
  use_external_ip: false
  # 原生 livekit-server (Windows): 监听 0.0.0.0, 浏览器直连 LAN IP (无 Docker 转发限制)
  node_ip: 192.168.31.104

redis:
  # 原生模式: 容器 redis 的宿主映射端口
  address: localhost:6379

keys:
  devkey: secret

ingress:
  # 原生 livekit-server (Windows) 时, ingress 容器经 host.docker.internal 访问
  rtmp_base_url: "rtmp://ingress:1935"
  whip_base_url: "http://ingress:8080"

logging:
  level: info
