# LiveKit Ingress 服务配置 (Windows 原生研发模式)
# ingress 是独立进程: livekit-server 通过 Redis psrpc 总线派发 ingress 请求,
# 本进程监听 RTMP 1935 (收 mediamtx 转发) / WHIP 8082, 再以 publisher 身份加入房间
# 二进制: livekit/ingress 仓库 cmd/server 本地构建 (release 无 Windows 预编译包)
redis:
  address: localhost:6379

# 与 livekit-native.yaml 的 keys 保持一致 (dev 默认值)
api_key: devkey
api_secret: secret
ws_url: ws://127.0.0.1:7880

rtmp_port: 1935
whip_port: 8082
health_port: 7888

# 必须 >= 最低要求 (rtmp:1, whip:1, whip_bypass:0.05), 否则会话被拒: server capacity exceeded
cpu_cost:
  rtmp_cpu_cost: 2
  whip_cpu_cost: 2
  url_cpu_cost: 2
  whip_bypass_transcoding_cpu_cost: 0.1

logging:
  level: info

development: true
