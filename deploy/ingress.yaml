# LiveKit Ingress 服务配置
api_key: devkey
api_secret: secret
# 研发环境 (livekit host 网络): ws://192.168.31.104:7880; 生产: ws://livekit:7880
ws_url: ws://192.168.31.104:7880

redis:
  address: redis:6379

rtmp_port: 1935
whip_port: 8080

# 必须 >= 最低要求 (rtmp:1, whip:1, whip_bypass:0.05), 否则会话被拒: server capacity exceeded
cpu_cost:
  rtmp_cpu_cost: 2
  whip_cpu_cost: 2
  url_cpu_cost: 2
  whip_bypass_transcoding_cpu_cost: 0.1

logging:
  level: info
